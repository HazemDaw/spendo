name: spendo
description: Personal expense tracker — graduation project
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Charts
  fl_chart: ^0.68.0
  google_fonts: ^6.1.0

  # State (Phase 2 — add now so structure is ready)
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Routing
  go_router: ^13.0.0

  # Utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true   # enables l10n generation
